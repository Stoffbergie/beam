name = "beam"
main = "src/worker.ts"
compatibility_date = "2026-10-12"
account_id = "628c0e516646e33b3f22f2e8741bf0a5"
workers_dev = false
upload_source_maps = true

routes = [{ pattern = "beam.stoff.dev", custom_domain = true }, { pattern = "*.stoffberg.dev/*", zone_name = "stoffberg.dev" }]

[vars]
TUNNEL_DOMAIN = "stoffberg.dev"

[observability]
enabled = true
head_sampling_rate = 0.1

[assets]
directory = "public"

[triggers]
crons = []

[[durable_objects.bindings]]
name = "BEAMS"
class_name = "Beam"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Beam"]

[[ratelimits]]
name = "CREATES"
namespace_id = "2002"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "LOOKUPS"
namespace_id = "2003"
simple = { limit = 300, period = 60 }
