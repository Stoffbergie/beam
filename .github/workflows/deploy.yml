name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true

      - run: vp run check

      - run: vp run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test
        run: |
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors https://beam.stoff.dev | grep -q '^beam: '
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://beam.stoff.dev/smoke/connect)" = "401"
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://smoke-offline.beam.stoff.dev/)" = "502"
