[package]
name = "beam"
version = "0.4.0"
edition = "2021"
authors = ["Dirk Beukes"]
description = "Share local servers through public HTTPS URLs."
license = "MIT"
repository = "https://github.com/Stoffbergie/beam"
keywords = ["cli", "tunnel", "localhost", "websocket"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-channel = { version = "0.3.34", features = ["sink"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "process", "signal", "time", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
