[package]
name = "beam"
version = "0.1.0"
edition = "2021"
authors = ["Dirk Beukes"]
description = "Your localhost, on the internet"
license = "MIT"
repository = "https://github.com/Stoffbergie/beam"
keywords = ["cli", "tunnel", "webhooks", "localhost"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
futures-channel = { version = "0.3.34", features = ["sink"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "process", "signal", "time", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
